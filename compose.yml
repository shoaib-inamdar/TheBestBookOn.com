services:
  app:
    build: .
    container_name: thebestbookon-app
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-auto-generated-secret-key-change-in-production}
    volumes:
      # Mount database as volume to persist data across restarts
      - app-data:/app
    networks:
      - thebestbookon-network
    # Don't expose port directly, nginx will proxy
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: thebestbookon-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - thebestbookon-network

volumes:
  app-data:
    driver: local

networks:
  thebestbookon-network:
    driver: bridge
