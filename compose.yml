services:
  app:
    build: .
    container_name: thebestbookon-app
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-auto-generated-secret-key-change-in-production}
    # Uncomment to persist database between container rebuilds:
    # volumes:
    #   - ./data:/app
    networks:
      - thebestbookon-network
    # Don't expose port directly, nginx will proxy
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: thebestbookon-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - thebestbookon-network

networks:
  thebestbookon-network:
    driver: bridge
