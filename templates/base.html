<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TheBestBookOn{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="container">
        <a href="/" class="logo"
            style="display: flex; align-items: center; gap: 10px; text-decoration: none; margin: 10px 0;">
            <img src="/static/logo.png" alt="Logo" style="height: 40px; width: auto;">
            TheBestBookOn.com
        </a>

        <div style="flex-grow: 1; margin: 0 40px; position: relative;">
            <form action="/" method="get" id="searchForm">
                <input type="text" name="q" id="searchInput" placeholder="Search prompts by tag..."
                    value="{{ request.query_params.get('q', '') }}" autocomplete="off"
                    style="width: 100%; padding: 8px 15px; border-radius: 20px; border: 1px solid #ddd; background: #f9f9f9; font-size: 0.9rem;">
            </form>
            <div id="headerSearchSuggestions" class="search-results"
                style="position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 0 0 8px 8px; margin-top: 5px;">
            </div>

            <script>
                const searchInput = document.getElementById('searchInput');
                const searchResults = document.getElementById('headerSearchSuggestions');
                const searchForm = document.getElementById('searchForm');

                searchInput.addEventListener('input', async (e) => {
                    const query = e.target.value.trim();
                    if (query.length < 1) {
                        searchResults.classList.remove('active');
                        return;
                    }

                    try {
                        const res = await fetch(`/api/tags?q=${encodeURIComponent(query)}`);
                        const tags = await res.json();

                        searchResults.innerHTML = '';
                        if (tags.length > 0) {
                            tags.forEach(tag => {
                                const div = document.createElement('div');
                                div.className = 'search-result-item';
                                div.innerText = tag;
                                div.onclick = () => {
                                    searchInput.value = tag;
                                    searchResults.classList.remove('active');
                                    searchForm.submit();
                                };
                                searchResults.appendChild(div);
                            });
                            searchResults.classList.add('active');
                        } else {
                            searchResults.classList.remove('active');
                        }
                    } catch (err) {
                        console.error(err);
                    }
                });

                // Close on click outside
                window.addEventListener('click', (e) => {
                    if (!e.target.closest('#headerSearchSuggestions') && e.target !== searchInput) {
                        searchResults.classList.remove('active');
                    }
                });
            </script>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            {% if user %}
            <span>Hello, <strong>{{ user }}</strong></span>
            <a href="/logout" class="btn btn-outline" style="padding: 5px 10px; font-size: 0.8rem;">Logout</a>
            {% else %}
            <a href="/login" class="btn btn-primary" style="padding: 5px 15px;">Login</a>
            {% endif %}
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container"
        style="margin-top: 60px; padding-bottom: 40px; color: #888; font-size: 0.9rem; text-align: center;">
        &copy; 2026 TheBestBookOn.com
    </footer>

    <script>
        async function toggleFavorite(event, promptId, btn) {
            // Prevent clicking the card link
            event.stopPropagation();
            event.preventDefault();

            try {
                const res = await fetch(`/api/prompts/${promptId}/toggle_favorite`, { method: 'POST' });
                const data = await res.json();

                if (data.favorited) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            } catch (err) {
                console.error("Failed to toggle favorite", err);
            }
        }

        async function deletePrompt(event, promptId) {
            event.stopPropagation();
            event.preventDefault();
            if (!confirm("Are you sure you want to delete this prompt?")) return;

            try {
                const res = await fetch(`/api/prompts/${promptId}`, { method: 'DELETE' });
                if (res.ok) {
                    window.location.reload();
                } else {
                    alert("Failed to delete prompt");
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteSubmission(event, subId) {
            event.stopPropagation();
            event.preventDefault();
            if (!confirm("Are you sure you want to delete this nomination?")) return;

            try {
                const res = await fetch(`/api/submissions/${subId}`, { method: 'DELETE' });
                if (res.ok) {
                    window.location.reload();
                } else {
                    alert("Failed to delete nomination");
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
