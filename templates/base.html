<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TheBestBookOn{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="container">
        <a href="/" class="logo"
            style="display: flex; align-items: center; gap: 10px; text-decoration: none; margin: 10px 0;">
            <img src="/static/logo.png" alt="Logo" style="height: 40px; width: auto;">
            TheBestBookOn.com
        </a>

        <div style="flex-grow: 1; margin: 0 40px;">
            <form action="/" method="get">
                <input type="text" name="q" placeholder="Search prompts by tag..."
                    value="{{ request.query_params.get('q', '') }}"
                    style="width: 100%; padding: 8px 15px; border-radius: 20px; border: 1px solid #ddd; background: #f9f9f9; font-size: 0.9rem;">
            </form>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            {% if user %}
            <span>Hello, <strong>{{ user }}</strong></span>
            <a href="/logout" class="btn btn-outline" style="padding: 5px 10px; font-size: 0.8rem;">Logout</a>
            {% else %}
            <a href="/login" class="btn btn-primary" style="padding: 5px 15px;">Login</a>
            {% endif %}
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container"
        style="margin-top: 60px; padding-bottom: 40px; color: #888; font-size: 0.9rem; text-align: center;">
        &copy; 2026 TheBestBookOn.com
    </footer>

    {% block scripts %}{% endblock %}
</body>

</html>
