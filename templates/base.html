<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TheBestBookOn{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="container">
        <a href="/" class="logo">TheBestBookOn...</a>
        <div class="user-badge">
            Logged in as: <strong>{{ user }}</strong>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container" style="margin-top: 60px; padding-bottom: 40px; color: #888; font-size: 0.9rem; text-align: center;">
        &copy; 2026 TheBestBookOn.com
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
