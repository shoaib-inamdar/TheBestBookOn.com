{% extends "base.html" %}

{% block content %}
<div
    style="max-width: 400px; margin: 50px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2 style="text-align: center; margin-bottom: 20px;">Login</h2>
    <p style="text-align: center; color: #666; margin-bottom: 20px;">Use your Internet Archive account.</p>

    {% if error %}
    <div
        style="background: #fee; color: #c00; padding: 10px; border-radius: 4px; margin-bottom: 20px; text-align: center;">
        {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="post">
        <div class="form-group">
            <label>Email / Username</label>
            <input type="text" name="email" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
    </form>
</div>
{% endblock %}
